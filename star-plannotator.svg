  <!-- url -->
  <text x="416" y="98" text-anchor="end" font-family="ui-monospace,'SF Mono',Menlo,Consolas,monospace" font-size="11.5" fill="#8A8985">github.com/backnotprop/plannotator</text>
</svg>
