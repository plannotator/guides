<svg xmlns="http://www.w3.org/2000/svg" width="440" height="112" viewBox="0 0 440 112" role="img" aria-label="Star Plannotator on GitHub">
  <rect width="440" height="112" rx="14" fill="#0a0a0a"/>
  <!-- off-white cut-paper slip: star -->
  <g transform="rotate(-1.4 90 46)">
    <polygon points="24,22 156,18 158,72 22,75" fill="#ECEAE3"/>
    <polygon points="24,22 156,18 158,72 22,75" fill="none" stroke="#000" stroke-opacity=".08"/>
  </g>
  <path transform="translate(50,46) scale(1.05)" d="M0,-16 L4.7,-4.9 L16.7,-3.9 L7.6,4 L10.3,15.7 L0,9.5 L-10.3,15.7 L-7.6,4 L-16.7,-3.9 L-4.7,-4.9 Z" fill="#0a0a0a"/>
